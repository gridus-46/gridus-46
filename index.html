<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lí Công việc / Học tập</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
        body { background: #f4f6f8; margin: 0; padding: 0; }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; margin-bottom: 20px; font-size: 22px; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; font-size: 14px; }
        button { padding: 10px 14px; font-size: 14px; cursor: pointer; border: none; border-radius: 4px; }
        .add-btn { background: #007bff; color: white; }
        ul { list-style: none; padding: 0; margin-top: 20px; }
        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
        li.completed span { text-decoration: line-through; color: #888; }
        .actions button { margin-left: 5px; }
        .done-btn { background: #28a745; color: white; }
        .delete-btn { background: #dc3545; color: white; }
    </style>
</head>
<body>
<div class="container">
    <h1>Quản lí Công việc / Học tập</h1>
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Nhập công việc hoặc bài học...">
        <button class="add-btn" onclick="addTask()">Thêm</button>
    </div>
    <ul id="taskList"></ul>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function saveTasks() {
        localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function renderTasks() {
        const taskList = document.getElementById("taskList");
        taskList.innerHTML = "";
        tasks.forEach((task, index) => {
            const li = document.createElement("li");
            if (task.completed) li.classList.add("completed");

            const span = document.createElement("span");
            span.textContent = task.text;

            const actions = document.createElement("div");
            actions.className = "actions";

            const doneBtn = document.createElement("button");
            doneBtn.textContent = "✓";
            doneBtn.className = "done-btn";
            doneBtn.onclick = () => toggleTask(index);

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "✕";
            deleteBtn.className = "delete-btn";
            deleteBtn.onclick = () => deleteTask(index);

            actions.appendChild(doneBtn);
            actions.appendChild(deleteBtn);

            li.appendChild(span);
            li.appendChild(actions);
            taskList.appendChild(li);
        });
    }

    function addTask() {
        const input = document.getElementById("taskInput");
        const text = input.value.trim();
        if (text === "") return;
        tasks.push({ text: text, completed: false });
        input.value = "";
        saveTasks();
        renderTasks();
    }

    function toggleTask(index) {
        tasks[index].completed = !tasks[index].completed;
        saveTasks();
        renderTasks();
    }

    function deleteTask(index) {
        tasks.splice(index, 1);
        saveTasks();
        renderTasks();
    }

    renderTasks();
</script>
</body>
</html>
